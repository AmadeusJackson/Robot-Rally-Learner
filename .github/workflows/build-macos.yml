name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:apple
      - run: npm test
      - run: python3 -B test/local_model_test.py
      - run: npm run test:e2e
      - name: Build DMG
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npm run dist:mac:${{ matrix.arch }} -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Rally-Learning-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run dist:win -- --publish never
      - name: Install and test the Windows build
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*.exe).FullName
          $proc = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with $($proc.ExitCode)" }
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -File -Filter 'Robot Rally Learning.exe' | Select-Object -First 1
          if (!$app) { throw "Installed Robot Rally executable was not found." }
          $env:RALLY_TEST_EXECUTABLE = $app.FullName
          $env:DEBUG = 'pw:browser*'
          Write-Host "Testing installed executable at $($app.FullName)"
          node --test test/e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Robot-Rally-Learning-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish desktop installers
    needs: [build, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Robot-Rally-Learning-*
          path: installers
          merge-multiple: true
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 x64; do
            mv "installers/Robot Rally Learning-$version-$arch.dmg" "installers/Robot-Rally-Learning-$version-$arch.dmg"
          done
          test -s "installers/Robot-Rally-Learning-$version-windows-x64.exe"
          gh release create "$GITHUB_REF_NAME" installers/*.dmg installers/*.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
